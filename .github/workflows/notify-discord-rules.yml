name: Notify Discord about rules changes

on:
  push:
    branches: [main]
    paths:
      - '**.mdx'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build a compact rules diff
        id: diff
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if [[ "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          git diff --unified=0 "$base" '${{ github.sha }}' -- '*.mdx' > /tmp/rules.diff
          awk '!/^\+\+\+ / && !/^--- / && (/^\+/ || /^-/)' /tmp/rules.diff \
            | awk '{ sign=substr($0,1,1); text=substr($0,2); gsub(/\*\*/, "", text); gsub(/\x60/, "", text); if (text ~ /^[[:space:]]*(<|>|---|title:|description:|sidebarTitle:|icon:|href:)/) next; if (text ~ /^[[:space:]]*$/) next; print sign " " text }' \
            | awk '!seen[$0]++' > /tmp/rules-lines.diff
          if [ ! -s /tmp/rules-lines.diff ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send changed lines to Discord
        if: steps.diff.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RULES_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          (async () => {
          const { readFileSync } = require('node:fs');

          const webhook = process.env.DISCORD_WEBHOOK_URL;
          if (!webhook) throw new Error('Secretul DISCORD_RULES_WEBHOOK_URL nu este configurat.');

          const lines = readFileSync('/tmp/rules-lines.diff', 'utf8').trimEnd().split('\n');
          const chunks = [];
          let current = '';
          for (const line of lines) {
            const next = current ? current + '\n' + line : line;
            if ((`\`\`\`diff\n${next}\n\`\`\``).length > 1900 && current) {
              chunks.push(current);
              current = line;
            } else {
              current = next;
            }
          }
          if (current) chunks.push(current);

          for (const chunk of chunks) {
            const target = `${webhook}${webhook.includes('?') ? '&' : '?'}with_components=true`;
            const response = await fetch(target, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                flags: 32768,
                components: [
                  { type: 10, content: '# Regulament actualizat' },
                  { type: 14, divider: true, spacing: 1 },
                  { type: 10, content: `\`\`\`diff\n${chunk}\n\`\`\`` },
                  { type: 14, divider: true, spacing: 1 },
                  {
                    type: 9,
                    components: [{ type: 10, content: '1st APP' }],
                    accessory: { type: 2, style: 5, label: 'Regulament', url: 'https://rules.mc-1st.ro' }
                  }
                ]
              })
            });
            if (!response.ok) {
              throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
            }
          }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
