server {
    listen 80;
    listen [::]:80;
    server_name ai.mc-1st.ro;

    # Required by Certbot for issuance and renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Cloudflare is in Flexible mode, so proxied traffic reaches this origin by HTTP.
    # Only Cloudflare's published proxy ranges may use the API; direct IP traffic is denied.
    location = /chat {
        # Allows this VPS to run a health/integration check through its own proxied hostname.
        allow 188.34.196.10;
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.mc-1st.ro;

    ssl_certificate /etc/ssl/cloudflare/ai.mc-1st.ro.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai.mc-1st.ro.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /chat {
        # Allows this VPS to run a health/integration check through its own proxied hostname.
